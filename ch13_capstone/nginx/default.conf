# Reverse proxy for the API. "api" resolves to every replica of the service;
# Nginx resolves the name once at startup and round-robins between the addresses.
upstream vietmart_api {
    server api:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://vietmart_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
