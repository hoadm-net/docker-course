# Chapter 12 - giving a container access to NVIDIA GPUs (needs the NVIDIA Container Toolkit on the host).
#   docker compose -f compose.gpu.yaml run --rm gpu-check
services:
  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    command: nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
