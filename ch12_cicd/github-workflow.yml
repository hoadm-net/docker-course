# Chapter 12 - build, test and push the image with GitHub Actions.
# Copy to .github/workflows/docker.yml in your own repository.
# Check each action's releases page for the current major version.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vietmart-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and smoke-test
        uses: docker/build-push-action@v6
        with:
          context: app-v1
          load: true
          tags: vietmart-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name api -p 8000:8000 vietmart-api:ci
          sleep 5
          curl --fail http://localhost:8000/healthz

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: app-v1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
